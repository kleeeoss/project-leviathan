name: Leviathan Enterprise CI

# Trigger this pipeline every time code is pushed to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  python-validation:
    name: Python Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          # We install flake8 to scan the code for syntax errors and undefined names

      - name: Run Python Linter
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,env,.git,__pycache__,infrastructure

  terraform-validation:
    name: Infrastructure as Code (IaC) Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup HashiCorp Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        working-directory: ./infrastructure
        run: terraform init -backend=false
        # backend=false ensures we just test the code without needing real AWS credentials

      - name: Validate Terraform Syntax
        working-directory: ./infrastructure
        run: terraform validate
        # This checks if the main.tf file has perfect syntax
